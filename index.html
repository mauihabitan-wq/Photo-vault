<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Photo Vault | Store & Manage Your Images</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', 'Helvetica Neue', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #f5f7fc 0%, #eef2f8 100%);
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    /* main container */
    .app-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* header area */
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .header h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #1e2b3c, #2c4c6e);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .header h1::before {
      content: "📸";
      font-size: 2.2rem;
      background: none;
      color: #2c4c6e;
    }

    .sub {
      color: #4a627a;
      margin-top: 8px;
      font-weight: 500;
    }

    /* upload card */
    .upload-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(2px);
      border-radius: 2rem;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
      padding: 1.8rem 2rem;
      margin-bottom: 2.5rem;
      border: 1px solid rgba(255,255,240,0.6);
      transition: all 0.2s;
    }

    .upload-area {
      border: 2px dashed #bac8d9;
      border-radius: 1.6rem;
      background: #fefefe;
      padding: 2rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .upload-area:hover {
      border-color: #3b82f6;
      background: #f0f7ff;
    }

    .upload-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .upload-area p {
      color: #2c3e50;
      font-weight: 500;
    }

    .file-input-label {
      display: inline-block;
      background: #1f3b4c;
      color: white;
      padding: 10px 24px;
      border-radius: 60px;
      font-weight: 600;
      margin-top: 18px;
      cursor: pointer;
      transition: 0.2s;
      border: none;
      font-size: 0.9rem;
    }

    .file-input-label:hover {
      background: #0f2b3a;
      transform: scale(0.97);
    }

    input[type="file"] {
      display: none;
    }

    .preview-row {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .preview-thumb {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #eef2fa;
      padding: 6px 16px 6px 10px;
      border-radius: 60px;
    }

    .preview-thumb img {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
    }

    .store-btn {
      background: #2c6e49;
      border: none;
      color: white;
      padding: 12px 28px;
      border-radius: 40px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }

    .store-btn:active {
      transform: scale(0.96);
    }

    .store-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* gallery header + controls */
    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      gap: 12px;
    }

    .gallery-header h2 {
      font-size: 1.7rem;
      font-weight: 600;
      color: #1e2f3e;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stats-badge {
      background: #dce5f2;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #1e3a5f;
    }

    .delete-all {
      background: transparent;
      border: 1px solid #dc2626;
      color: #b91c1c;
      padding: 8px 18px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
    }

    .delete-all:hover {
      background: #fee2e2;
      border-color: #dc2626;
    }

    /* masonry grid */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.8rem;
    }

    .photo-card {
      background: white;
      border-radius: 1.5rem;
      overflow: hidden;
      box-shadow: 0 12px 24px -12px rgba(0, 0, 0, 0.2);
      transition: all 0.25s ease;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255,255,245,0.8);
      animation: fadeIn 0.3s ease;
    }

    .photo-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 22px 30px -14px rgba(0, 0, 0, 0.25);
    }

    .photo-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: #f2f4f8;
      cursor: pointer;
    }

    .card-info {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffffdd;
      backdrop-filter: blur(4px);
      border-top: 1px solid #eef2f0;
    }

    .photo-date {
      font-size: 0.7rem;
      color: #4b6b8f;
      font-weight: 500;
    }

    .delete-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: #9ca3af;
      transition: 0.2s;
      padding: 4px 8px;
      border-radius: 40px;
    }

    .delete-btn:hover {
      color: #e11d48;
      background: #ffe4e8;
      transform: scale(1.05);
    }

    /* empty state */
    .empty-state {
      background: rgba(255,255,245,0.6);
      border-radius: 2rem;
      text-align: center;
      padding: 3.5rem 1.5rem;
      color: #5a6e85;
      font-size: 1.1rem;
      border: 1px dashed #b9cef0;
    }

    .empty-state span {
      font-size: 3rem;
      display: block;
      margin-bottom: 1rem;
    }

    /* lightbox modal */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: visibility 0.2s, opacity 0.2s;
    }

    .lightbox.active {
      visibility: visible;
      opacity: 1;
    }

    .lightbox-content {
      max-width: 90vw;
      max-height: 85vh;
      position: relative;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 28px;
      box-shadow: 0 30px 50px rgba(0,0,0,0.5);
      border: 2px solid rgba(255,255,240,0.3);
    }

    .close-lightbox {
      position: absolute;
      top: -40px;
      right: 0;
      background: rgba(30,30,40,0.8);
      border: none;
      color: white;
      font-size: 1.8rem;
      cursor: pointer;
      border-radius: 60px;
      width: 42px;
      height: 42px;
      font-weight: bold;
      transition: 0.2s;
    }

    /* toast */
    .toast-msg {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      background: #1e293bc9;
      backdrop-filter: blur(12px);
      color: white;
      padding: 12px 28px;
      border-radius: 60px;
      font-weight: 500;
      font-size: 0.9rem;
      z-index: 1100;
      opacity: 0;
      transition: 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      font-size: 0.75rem;
      color: #6b7f99;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 1rem;
      }
      .upload-card {
        padding: 1rem;
      }
      .photo-grid {
        gap: 1rem;
      }
    }
  </style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>Photo Vault</h1>
    <div class="sub">store · organize · cherish your moments</div>
  </div>

  <!-- UPLOAD SECTION -->
  <div class="upload-card">
    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">🖼️⬆️</div>
      <p>Drag & drop or click to select photos</p>
      <label class="file-input-label" for="photoInput">Choose images</label>
      <input type="file" id="photoInput" accept="image/jpeg, image/png, image/jpg, image/webp, image/gif" multiple>
    </div>
    <div id="previewContainer" class="preview-row" style="display: none;"></div>
  </div>

  <!-- GALLERY HEADER -->
  <div class="gallery-header">
    <h2>📁 My Photo Library <span class="stats-badge" id="photoCountBadge">0 items</span></h2>
    <button class="delete-all" id="deleteAllBtn">🗑️ Delete all photos</button>
  </div>

  <!-- DYNAMIC GRID -->
  <div id="photoGallery" class="photo-grid">
    <!-- empty state or cards injected here -->
  </div>
  <footer>⚡ stored locally in your browser — photos never leave your device</footer>
</div>

<!-- Lightbox Modal -->
<div id="lightbox" class="lightbox">
  <div class="lightbox-content">
    <button class="close-lightbox" id="closeLightboxBtn">✕</button>
    <img id="lightboxImg" class="lightbox-img" alt="enlarged view">
  </div>
</div>

<div id="toastMsg" class="toast-msg">✨ Action complete</div>

<script>
  // ---------- DATA STORAGE (localStorage) ----------
  const STORAGE_KEY = "photo_vault_images";

  // Each photo entry: { id, dataUrl, name, dateAdded }
  let photosArray = [];

  // Helper: load from localStorage
  function loadPhotosFromStorage() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      try {
        photosArray = JSON.parse(stored);
        // Basic validation: ensure it's array
        if (!Array.isArray(photosArray)) photosArray = [];
      } catch(e) { photosArray = []; }
    } else {
      photosArray = [];
    }
    renderGallery();
    updateStats();
  }

  // Save current array to localStorage and sync
  function persistPhotos() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(photosArray));
    updateStats();
    renderGallery();     // re-render on every change
  }

  // Update photo count badge
  function updateStats() {
    const badge = document.getElementById('photoCountBadge');
    if (badge) {
      const count = photosArray.length;
      badge.innerText = count === 1 ? "1 item" : `${count} items`;
    }
  }

  // Helper: format date nicely
  function formatDate(timestamp) {
    if (!timestamp) return "just now";
    const date = new Date(timestamp);
    return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
  }

  // show toast message
  function showToast(message, duration = 2200) {
    const toast = document.getElementById('toastMsg');
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
    }, duration);
  }

  // render gallery from photosArray
  function renderGallery() {
    const galleryContainer = document.getElementById('photoGallery');
    if (!galleryContainer) return;

    if (!photosArray.length) {
      galleryContainer.innerHTML = `
        <div class="empty-state">
          <span>📭</span>
          <p>Your photo vault is empty.</p>
          <small>Upload pictures using the panel above ✨</small>
        </div>
      `;
      return;
    }

    let gridHtml = '';
    for (let i = 0; i < photosArray.length; i++) {
      const photo = photosArray[i];
      const safeId = photo.id;
      const imgSrc = photo.dataUrl;
      const dateLabel = formatDate(photo.dateAdded);
      const fileName = photo.name ? photo.name.substring(0, 28) : "image";
      
      gridHtml += `
        <div class="photo-card" data-id="${safeId}">
          <img class="photo-img" src="${imgSrc}" alt="${escapeHtml(fileName)}" loading="lazy">
          <div class="card-info">
            <span class="photo-date">📅 ${dateLabel}</span>
            <button class="delete-btn" data-id="${safeId}" title="delete photo">🗑️</button>
          </div>
        </div>
      `;
    }

    galleryContainer.innerHTML = gridHtml;

    // Attach delete event to each delete button (event delegation also works but we attach after innerHTML)
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.getAttribute('data-id');
        if (id) {
          deletePhotoById(id);
        }
      });
    });

    // Attach lightbox click for each photo image (open modal)
    document.querySelectorAll('.photo-img').forEach(img => {
      img.addEventListener('click', (e) => {
        const parentCard = img.closest('.photo-card');
        if (parentCard) {
          const rawId = parentCard.getAttribute('data-id');
          const foundPhoto = photosArray.find(p => p.id === rawId);
          if (foundPhoto && foundPhoto.dataUrl) {
            openLightbox(foundPhoto.dataUrl);
          }
        }
      });
    });
  }

  // Escape HTML to avoid XSS risks (though we trust dataUrl, but names are safe)
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
      return c;
    });
  }

  // delete by id
  function deletePhotoById(id) {
    const newArray = photosArray.filter(photo => photo.id !== id);
    if (newArray.length === photosArray.length) {
      showToast("Photo not found", 1200);
      return;
    }
    photosArray = newArray;
    persistPhotos();
    showToast("🗑️ Photo removed", 1500);
  }

  // delete all photos
  function deleteAllPhotos() {
    if (photosArray.length === 0) {
      showToast("No photos to delete", 1200);
      return;
    }
    if (confirm(`⚠️ Delete ALL ${photosArray.length} photos permanently? This cannot be undone.`)) {
      photosArray = [];
      persistPhotos();
      showToast("All photos deleted", 1800);
    }
  }

  // Lightbox logic
  const lightboxEl = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  function openLightbox(imgSrc) {
    if (!lightboxEl || !lightboxImg) return;
    lightboxImg.src = imgSrc;
    lightboxEl.classList.add('active');
  }
  function closeLightbox() {
    if (lightboxEl) lightboxEl.classList.remove('active');
  }
  if (lightboxEl) {
    lightboxEl.addEventListener('click', (e) => {
      if (e.target === lightboxEl) closeLightbox();
    });
    const closeBtn = document.getElementById('closeLightboxBtn');
    if (closeBtn) closeBtn.addEventListener('click', closeLightbox);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightboxEl.classList.contains('active')) {
        closeLightbox();
      }
    });
  }

  // Helper: read files as dataURLs and add to storage
  function addPhotosFromFiles(fileList) {
    if (!fileList || fileList.length === 0) return;
    const files = Array.from(fileList);
    const imageFiles = files.filter(file => file.type.startsWith('image/'));
    if (imageFiles.length === 0) {
      showToast("No valid image files selected", 1500);
      return;
    }

    let addedCount = 0;
    let processed = 0;
    const total = imageFiles.length;

    imageFiles.forEach(file => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const dataUrl = e.target.result;
        const newId = Date.now() + '-' + Math.random().toString(36).substring(2, 8) + '-' + file.name.replace(/\s/g, '_');
        const newPhoto = {
          id: newId,
          dataUrl: dataUrl,
          name: file.name,
          dateAdded: Date.now(),
        };
        photosArray.unshift(newPhoto);   // newest on top
        processed++;
        if (processed === total) {
          persistPhotos();
          showToast(`✅ ${addedCount + (total - processed)} photos added`, 1700);
          clearPreviewArea();   // clear preview after storing
        }
      };
      reader.onerror = () => {
        processed++;
        showToast(`Failed to read ${file.name}`, 1200);
        if (processed === total) {
          persistPhotos();  // still persist any successfully read
          clearPreviewArea();
        }
      };
      reader.readAsDataURL(file);
      addedCount++;
    });
  }

  // ---------- PREVIEW HANDLING (before storing) ----------
  const previewContainer = document.getElementById('previewContainer');
  let currentPreviewFiles = [];   // store File objects for preview

  function clearPreviewArea() {
    if (previewContainer) {
      previewContainer.innerHTML = '';
      previewContainer.style.display = 'none';
    }
    currentPreviewFiles = [];
    const storeBtn = document.getElementById('storeSelectedBtn');
    if (storeBtn) storeBtn.disabled = true;
  }

  function renderPreview(files) {
    if (!previewContainer) return;
    if (!files || files.length === 0) {
      previewContainer.style.display = 'none';
      previewContainer.innerHTML = '';
      currentPreviewFiles = [];
      const storeBtn = document.getElementById('storeSelectedBtn');
      if (storeBtn) storeBtn.disabled = true;
      return;
    }

    // show preview thumbnails and a store button
    let previewHtml = `<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">`;
    for (let i = 0; i < Math.min(files.length, 6); i++) {
      const file = files[i];
      const objectUrl = URL.createObjectURL(file);
      previewHtml += `
        <div class="preview-thumb">
          <img src="${objectUrl}" alt="preview">
          <span style="font-size:0.7rem; max-width:100px;">${escapeHtml(file.name.substring(0, 20))}</span>
        </div>
      `;
      // revoke later after store or clear but we keep for preview, will revoke on clear (best effort)
      setTimeout(() => URL.revokeObjectURL(objectUrl), 10000);
    }
    if (files.length > 6) {
      previewHtml += `<div class="preview-thumb">+${files.length - 6} more</div>`;
    }
    previewHtml += `
        <button id="storeSelectedBtn" class="store-btn">📥 Store ${files.length} photo(s) to vault</button>
      </div>`;
    previewContainer.innerHTML = previewHtml;
    previewContainer.style.display = 'flex';

    const storeBtn = document.getElementById('storeSelectedBtn');
    if (storeBtn) {
      storeBtn.disabled = false;
      // remove any old listeners and attach new
      const newBtn = storeBtn.cloneNode(true);
      storeBtn.parentNode.replaceChild(newBtn, storeBtn);
      newBtn.addEventListener('click', () => {
        if (currentPreviewFiles.length) {
          addPhotosFromFiles(currentPreviewFiles);
          // clear preview after storing
          currentPreviewFiles = [];
          renderPreview([]);
        }
      });
    }
  }

  // File input change handler
  const photoInput = document.getElementById('photoInput');
  if (photoInput) {
    photoInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length) {
        const imageFilesOnly = files.filter(f => f.type.startsWith('image/'));
        if (imageFilesOnly.length !== files.length) {
          showToast("Some files were not images and were ignored", 2000);
        }
        currentPreviewFiles = imageFilesOnly;
        renderPreview(currentPreviewFiles);
      } else {
        clearPreviewArea();
      }
      // reset input so same file can be re-uploaded later
      photoInput.value = '';
    });
  }

  // Drag & drop on upload area
  const uploadArea = document.getElementById('uploadArea');
  if (uploadArea) {
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = '#3b82f6';
      uploadArea.style.background = '#f0f9ff';
    });
    uploadArea.addEventListener('dragleave', () => {
      uploadArea.style.borderColor = '#bac8d9';
      uploadArea.style.background = '#fefefe';
    });
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = '#bac8d9';
      uploadArea.style.background = '#fefefe';
      const items = e.dataTransfer.files;
      if (items && items.length) {
        const files = Array.from(items);
        const imageFiles = files.filter(f => f.type.startsWith('image/'));
        if (imageFiles.length) {
          currentPreviewFiles = imageFiles;
          renderPreview(currentPreviewFiles);
        } else {
          showToast("Drop only image files (jpeg, png, webp, gif)", 1600);
        }
      }
    });
  }

  // Delete all button
  const deleteAllBtn = document.getElementById('deleteAllBtn');
  if (deleteAllBtn) deleteAllBtn.addEventListener('click', deleteAllPhotos);

  // INIT: load from storage and kickstart
  loadPhotosFromStorage();
  // ensure global clear preview on any store persistence 
  window.addEventListener('load', () => {
    // additional: click on upload area for convenience
    if (uploadArea && photoInput) {
      uploadArea.addEventListener('click', (e) => {
        if (e.target === uploadArea || e.target.closest('.upload-area')) {
          if (!e.target.classList.contains('file-input-label') && e.target !== photoInput) {
            photoInput.click();
          }
        }
      });
    }
  });
</script>
</body>
</html>
